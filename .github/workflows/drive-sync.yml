name: Sync Google Docs to GitHub
on:
  workflow_dispatch:

permissions:
  contents: 'write'
  id-token: 'write'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          service_account: 'my-service-account@teamjonity.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/213617463337/locations/global/workloadIdentityPools/github/providers/my-repo'

      - name: Clean previous output
        run: rm -rf output

      - name: Export Assignment folder
        uses: jonjonsson-chas/google-docs-to-markdown@main
        with:
          google_drive_folder_id: '1KY4aMu7o_gCZmq2YCNY0l3zeWrjhpowj'
          output_directory_path: 'output/Assignment'

      - name: Export Documentation folder
        uses: jonjonsson-chas/google-docs-to-markdown@main
        with:
          google_drive_folder_id: '1sinaL0YtKhye-QX4brsBHrJKZMu3ic5r'
          output_directory_path: 'output/Documentation'

      - name: Export Jonity folder
        uses: jonjonsson-chas/google-docs-to-markdown@main
        with:
          google_drive_folder_id: '1IxFOMTUMFKmPawL6ec7GmDPOt5N_ihfP'
          output_directory_path: 'output/Jonity'

      - name: Push to repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          destination_dir: google_docs
          disable_nojekyll: true
          github_token: ${{ github.token }}
          publish_branch: main
          publish_dir: output
